<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#redGrad)"/>

  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Open Hymnal Book Icon -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Left Page -->
    <path d="M120 160 C 180 148, 230 170, 256 195 L 256 375 C 230 350, 180 330, 120 340 Z" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M392 160 C 332 148, 282 170, 256 195 L 256 375 C 282 350, 332 330, 392 340 Z" opacity="0.95"/>
  </g>

  <!-- Musical Note floating above -->
  <g fill="#FFFFFF" transform="translate(236, 110) scale(1.4)">
    <circle cx="28" cy="40" r="8"/>
    <rect x="33" y="14" width="4" height="26"/>
    <path d="M35 14 C 42 16, 48 22, 50 30 C 47 24, 43 21, 35 20 Z"/>
  </g>

  <!-- Stylized Lines on Pages representing Hymn Stanzas -->
  <line x1="145" y1="210" x2="230" y2="210" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="235" x2="225" y2="235" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="260" x2="220" y2="260" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="285" x2="205" y2="285" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>

  <line x1="282" y1="210" x2="367" y2="210" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="287" y1="235" x2="367" y2="235" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="292" y1="260" x2="367" y2="260" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="307" y1="285" x2="367" y2="285" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
</svg>
